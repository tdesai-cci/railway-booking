            - heading "Zero convenience fee" [level=3] [ref=f17e124]
            - paragraph [ref=f17e125]: The fare you see is the fare you pay. No hidden IRCTC surcharge, no service charge tacked on at checkout.
        - article [ref=f17e126]:
          - generic [ref=f17e130]:
            - heading "Instant PNR & status" [level=3] [ref=f17e131]
            - paragraph [ref=f17e132]: Your ticket lands in under a second. Live train running status, platform and coach position included.
        - article [ref=f17e133]:
