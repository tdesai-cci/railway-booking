            - heading "Zero convenience fee" [level=3] [ref=f10e503]
            - paragraph [ref=f10e504]: The fare you see is the fare you pay. No hidden IRCTC surcharge, no service charge tacked on at checkout.
        - article [ref=f10e505]:
