            - heading "Zero convenience fee" [level=3] [ref=f9e503]
            - paragraph [ref=f9e504]: The fare you see is the fare you pay. No hidden IRCTC surcharge, no service charge tacked on at checkout.
        - article [ref=f9e505]:
